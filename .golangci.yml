version: '2'
run:
  timeout: 5m
  build-tags: [integration]
linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - unused
    - bodyclose
    - ineffassign
    - dupl
    - depguard
    - govet
  settings:
    dupl:
      threshold: 100
    depguard:
      rules:
        engine:
          files:
            - '${base-path}/internal/engine/**'
          deny:
            - pkg: github.com/wailsapp/wails
              desc: Engine must remain independent of desktop adapters
            - pkg: github.com/Mahmoud-s-Khedr/idm-enhanced/internal/desktop
              desc: Engine cannot depend on presentation
            - pkg: github.com/Mahmoud-s-Khedr/idm-enhanced/internal/ipc
              desc: Engine cannot depend on browser transport
  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - dupl
